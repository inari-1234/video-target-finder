name: Corrective 1 Source Applicator

on:
  push:
    branches:
      - video-target-finder-candidate

permissions:
  contents: write

# One-shot trigger commit. Remove this workflow after the generated source commit lands.
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-corrective1]')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video-target-finder-candidate
          fetch-depth: 0

      - name: Apply guarded runtime integration
        run: |
          python3 scripts/apply_corrective1_integration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("VideoTargetFinder/VideoAnalysisViewModel.swift")
          text = path.read_text(encoding="utf-8")
          old = '        DiagnosticLogger.log("feedback-rescan-input run=\\(rescanRunNumber) mergeCorrective=\\(mergeCorrectiveEnabledForRun ? \\"ON\\" : \\"OFF\\") reviews=\\(reviewInputText)")\n'
          new = (
              '        let mergeCorrectiveFlagText = mergeCorrectiveEnabledForRun ? "ON" : "OFF"\n'
              '        DiagnosticLogger.log("feedback-rescan-input run=\\(rescanRunNumber) mergeCorrective=\\(mergeCorrectiveFlagText) reviews=\\(reviewInputText)")\n'
          )
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"generated rescan input log: expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          swiftc -frontend -parse VideoTargetFinder/*.swift
          python3 -m py_compile scripts/verify_source.py
          python3 scripts/verify_source.py
          swiftc VideoTargetFinder/FeedbackRescanGapMergeCorrective.swift scripts/test_feedback_rescan_gap_merge_corrective.swift -o /tmp/corrective1-gap-merge-tests
          /tmp/corrective1-gap-merge-tests
          swiftc VideoTargetFinder/FeedbackRescanABDiagnostics.swift scripts/test_feedback_rescan_ab_diagnostics.swift -o /tmp/feedback-rescan-ab-tests
          /tmp/feedback-rescan-ab-tests
          swiftc VideoTargetFinder/ContinuityQualityGate.swift scripts/test_continuity_quality_gate.swift -o /tmp/continuity-quality-gate-tests
          /tmp/continuity-quality-gate-tests

      - name: Commit integrated sources
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "corrective1: connect guarded feedback merge runtime"
          git push origin HEAD:video-target-finder-candidate
