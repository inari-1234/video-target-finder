name: Corrective 1 Runtime Evidence Patch

on:
  push:
    branches:
      - video-target-finder-candidate

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[c1-log-patch]')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply diagnostic-only patch
        run: |
          python3 scripts/apply_c1_runtime_evidence_patch.py
          rm scripts/apply_c1_runtime_evidence_patch.py
          rm .github/workflows/c1-runtime-evidence-patch.yml

      - name: Static verification
        run: |
          swiftc -frontend -parse VideoTargetFinder/*.swift
          python3 -m py_compile scripts/verify_source.py
          python3 scripts/verify_source.py
          swiftc VideoTargetFinder/FeedbackRescanGapMergeCorrective.swift scripts/test_feedback_rescan_gap_merge_corrective.swift -o /tmp/corrective1-gap-merge-tests
          /tmp/corrective1-gap-merge-tests
          grep -Fq 'CURRENT_PROJECT_VERSION: 37' project.yml
          grep -Fq 'build37' .github/workflows/ios-build.yml
          echo 'Corrective 1 runtime evidence staging: PASS'

      - name: Commit qualified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'diag: expand Corrective 1 runtime evidence Build 37 [full-ci]'
          git push origin HEAD:video-target-finder-candidate
