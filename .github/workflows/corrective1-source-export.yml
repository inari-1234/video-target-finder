name: Corrective 1 Source Export

on:
  push:
    branches:
      - video-target-finder-candidate
    paths:
      - .github/workflows/corrective1-source-export.yml

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        run: |
          mkdir -p /tmp/corrective1-source
          rsync -a --exclude .git ./ /tmp/corrective1-source/
      - uses: actions/upload-artifact@v4
        with:
          name: corrective1-source-export
          path: /tmp/corrective1-source
          include-hidden-files: true
          if-no-files-found: error
