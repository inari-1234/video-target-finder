name: Corrective 1 Source Export

on:
  push:
    branches:
      - video-target-finder-candidate
    paths:
      - .github/workflows/corrective1-source-export.yml

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source inputs
        run: |
          mkdir -p /tmp/corrective1-source/VideoTargetFinder /tmp/corrective1-source/scripts /tmp/corrective1-source/.github/workflows
          cp VideoTargetFinder/VideoAnalysisViewModel.swift /tmp/corrective1-source/VideoTargetFinder/
          cp VideoTargetFinder/ContentView.swift /tmp/corrective1-source/VideoTargetFinder/
          cp project.yml /tmp/corrective1-source/
          cp scripts/verify_source.py /tmp/corrective1-source/scripts/
          cp .github/workflows/ios-build.yml /tmp/corrective1-source/.github/workflows/
      - uses: actions/upload-artifact@v4
        with:
          name: corrective1-source-export
          path: /tmp/corrective1-source
          if-no-files-found: error
